# Render Blueprint.
# Docs: https://render.com/docs/blueprint-spec
services:
  # --- Projet 1 : Paname Roof (serveur Node, inchangé) ---
  - type: web
    name: paname-roof
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      # Set this in the Render dashboard (Environment tab). Use sk_test_... first, then sk_live_...
      - key: STRIPE_SECRET_KEY
        sync: false
      # Optional but recommended: from the Stripe webhook you create at /api/webhook (whsec_...)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # BASE_URL is auto-filled from RENDER_EXTERNAL_URL; no need to set it.

  # --- Projet 2 : TapMenu (site statique, dossier menu-nfc/) ---
  # Aucune compilation : Render sert directement les fichiers du dossier.
  - type: web
    name: tapmenu
    runtime: static
    plan: free
    buildCommand: "echo 'Site statique, aucune compilation'"
    staticPublishPath: ./menu-nfc
    autoDeploy: true
