<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RDV confirmé — Mai Anh Nails</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #FBF6F0; --ink: #2B2320; --ink-soft: #4A403A; --muted: #8D8079;
      --line: rgba(43,35,32,0.10); --blush: #E8C4C4; --rose-deep: #A85D63; --plum: #6E3E4A;
      --ok: #3B8C6E; --err: #C0483F; --shadow: 0 18px 50px rgba(110,62,74,0.16);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background:
        radial-gradient(900px 460px at 80% -10%, rgba(232,196,196,0.5), transparent 60%),
        radial-gradient(600px 360px at 0% 110%, rgba(231,213,174,0.4), transparent 60%), var(--cream);
      color: var(--ink); font-family: 'Inter', system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 28px; }
    h1, .display { font-family: 'Cormorant Garamond', Georgia, serif; }
    .card { width: 100%; max-width: 540px; background: #fff; border: 1px solid var(--line);
      border-radius: 22px; box-shadow: var(--shadow); padding: 38px 34px; text-align: center; }
    .check { width: 68px; height: 68px; margin: 0 auto 18px; border-radius: 50%;
      background: var(--ok); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 34px; }
    .spinner { width: 44px; height: 44px; margin: 30px auto; border: 3px solid var(--blush);
      border-top-color: var(--rose-deep); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 38px; margin: 4px 0 6px; }
    .sub { color: var(--muted); margin-bottom: 24px; }
    .recap { text-align: left; background: #FBEFF0; border: 1px solid var(--blush); border-radius: 14px; padding: 20px 22px; margin: 22px 0; }
    .recap .row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 15px; }
    .recap .row + .row { border-top: 1px solid rgba(168,93,99,0.12); }
    .recap .row b { color: var(--plum); }
    .recap .big { font-family: 'Cormorant Garamond', serif; font-size: 22px; }
    .addr { background: var(--cream); border-radius: 14px; padding: 16px 18px; margin: 18px 0; font-size: 14.5px; color: var(--ink-soft); }
    .addr a { color: var(--rose-deep); font-weight: 600; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 500;
      padding: 13px 26px; border-radius: 999px; border: 1px solid transparent; cursor: pointer; text-decoration: none; }
    .btn-primary { background: var(--rose-deep); color: #fff; }
    .btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
    .err { color: var(--err); }
    .note { font-size: 13px; color: var(--muted); margin-top: 18px; }
    .demo-tag { display: inline-block; font-size: 12px; color: var(--muted); background: var(--cream); padding: 3px 10px; border-radius: 999px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="spinner"></div>
    <p class="sub">Confirmation de votre rendez-vous…</p>
  </div>

  <script>
  (function () {
    var params = new URLSearchParams(location.search);
    var q = params.get('session_id') ? ('session_id=' + encodeURIComponent(params.get('session_id')))
      : ('booking=' + encodeURIComponent(params.get('booking') || '') + '&demo=' + (params.get('demo') || ''));
    var card = document.getElementById('card');

    function esc(s) { return String(s || '').replace(/[&<>]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;' }[c]; }); }
    function fmtDate(d) {
      var dt = new Date(d + 'T00:00:00Z');
      return dt.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
    }
    function dur(m) { if (m >= 60) { var h = Math.floor(m/60), r = m%60; return h + 'h' + (r ? String(r).padStart(2,'0') : ''); } return m + ' min'; }

    fetch('/api/booking?' + q).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.j.error || 'Réservation introuvable.');
        var b = res.j, s = b.salon || {};
        card.innerHTML =
          (b.demo ? '<span class="demo-tag">Réservation démo</span>' : '') +
          '<div class="check">✓</div>' +
          '<h1>Rendez-vous confirmé</h1>' +
          '<p class="sub">Merci ' + esc(b.name) + ' ! Votre créneau est réservé.</p>' +
          '<div class="recap">' +
            '<div class="row"><span>Prestation</span><b>' + esc(b.serviceName) + '</b></div>' +
            '<div class="row"><span>Date</span><span class="big">' + fmtDate(b.date) + '</span></div>' +
            '<div class="row"><span>Heure</span><span class="big">' + esc(b.startLabel) + '</span></div>' +
            '<div class="row"><span>Durée</span><span>' + dur(b.duration) + '</span></div>' +
            '<div class="row"><span>Réglé</span><b>' + b.price + ' €</b></div>' +
          '</div>' +
          '<div class="addr">📍 <b>' + esc(s.name) + '</b><br>' + esc(s.address) +
            (s.mapsUrl ? ' · <a href="' + esc(s.mapsUrl) + '" target="_blank" rel="noopener">Itinéraire</a>' : '') +
            (s.phone ? '<br>📞 <a href="tel:' + esc(s.phone).replace(/\s/g,'') + '">' + esc(s.phone) + '</a>' : '') +
          '</div>' +
          '<div class="actions">' +
            '<a class="btn btn-primary" href="/#rdv">Prendre un autre RDV</a>' +
            '<a class="btn btn-ghost" href="/">Retour à l’accueil</a>' +
          '</div>' +
          '<p class="note">Un empêchement ? Prévenez-nous au plus tôt' + (s.phone ? ' au ' + esc(s.phone) : '') + '.</p>';
      })
      .catch(function (e) {
        card.innerHTML =
          '<h1>Oups…</h1>' +
          '<p class="sub err">' + esc(e.message) + '</p>' +
          '<p class="sub">Si vous avez été débité, contactez-nous : votre RDV sera bien pris en compte.</p>' +
          '<div class="actions"><a class="btn btn-primary" href="/#rdv">Réessayer</a><a class="btn btn-ghost" href="/">Accueil</a></div>';
      });
  })();
  </script>
</body>
</html>
